name: Distribution packages
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  packages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked build tools
        run: python -m pip install --require-hashes -r build-requirements.lock
      - name: Build and verify separate distributions and plugins
        run: python scripts/build_release.py --output dist/release
      - uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: dist/release/
