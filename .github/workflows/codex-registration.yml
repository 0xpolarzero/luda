name: Codex plugin registration
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  pinned-cli-registration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/tools/codex-cli/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked test-only CLI and Python dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix tests/tools/codex-cli
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Require exact CLI version and execute real registration contracts
        run: python tests/tools/codex-cli/run_registration_tests.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codex-cli-registration-evidence
          path: artifacts/codex-cli-registration/
  upstream-installers:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Create an isolated installation account
        run: sudo useradd --system --create-home --shell /bin/bash luda-installer-test
      - name: Install the complete managed runtime and private installer dependencies
        run: sudo bash scripts/install.sh --prefix /opt/luda-installer-test --user luda-installer-test --runtime-only --skip-system --yes
      - name: Exercise real skill and MCP installers for every supported client
        run: sudo python3 tests/integration_setup_installers.py --prefix /opt/luda-installer-test --user luda-installer-test --output "$GITHUB_WORKSPACE/artifacts/upstream-installers"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-installer-evidence
          path: artifacts/upstream-installers/
