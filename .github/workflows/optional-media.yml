name: Optional desktop media
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  media-x11:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install optional engines and private desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xfwm4 dbus-x11 at-spi2-core python3-gi python3-gi-cairo gir1.2-atspi-2.0 gir1.2-gtk-3.0 xdotool wmctrl scrot xclip x11-utils x11-xserver-utils libxrandr2 fonts-dejavu-core tesseract-ocr tesseract-ocr-eng ffmpeg python3-opencv
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r requirements.lock
          .venv/bin/python -m pip install --no-deps -e .
      - name: Observe rendered text, match icons and verify recording lifecycle
        run: .venv/bin/python scripts/qualification_matrix.py --suites ocr image-match recording recording-faults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: optional-media-evidence
          path: artifacts/
