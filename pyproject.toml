[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "luda"
version = "0.1.0"
description = "Local X11 desktop tools with explicit targeting and observable outcomes"
requires-python = ">=3.12"
dependencies = ["mcp==1.30.0", "Pillow>=12.0,<13"]

[project.optional-dependencies]
test = ["playwright==1.63.0"]

[project.scripts]
luda = "luda.server:main"
luda-session = "luda.session:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/luda/skills/luda" = ["skills/luda/SKILL.md"]
