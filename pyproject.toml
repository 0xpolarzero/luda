[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "luda"
version = "0.2.0"
description = "Linux desktop tools and skills for coding agents"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "polarzero"}]
keywords = ["mcp", "linux", "desktop", "computer-use", "agent-skills"]
requires-python = ">=3.12"
dependencies = ["mcp==1.30.0", "jsonschema==4.26.0", "Pillow>=12.0,<13"]

[project.urls]
Homepage = "https://github.com/0xpolarzero/luda"
Documentation = "https://github.com/0xpolarzero/luda#readme"
Source = "https://github.com/0xpolarzero/luda"
Issues = "https://github.com/0xpolarzero/luda/issues"
Releases = "https://github.com/0xpolarzero/luda/releases"

[project.optional-dependencies]
test = ["playwright==1.63.0"]
browser = ["playwright==1.63.0"]

[project.scripts]
luda = "luda.server:main"
luda-session = "luda.session:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/luda/skills/luda" = ["skills/luda/SKILL.md"]
"share/luda/skills/luda/references" = ["skills/luda/references/*.md"]

